# External Resources Configuration
schema: acman/v1
# This file defines external resources that will be installed into target harnesses.
# Local Skills
# Skills from the local skills/ folder in this repo. No name or source required.
# Only skills listed here (and enabled) are symlinked to target harnesses.
local:
  enabled: true
  # Tags live with the definition. Untagged elements are shared base content
  # and are always installed; tagged elements are selected with
  # `acman install --tag <tag>`.
  skills:
    - name: expert-in-swiss-laws
      tags: [developer, legal]
    - name: lazyvim-expert
      tags: [developer, editor]
    - name: loop-orchestration-engineer
      tags: [developer, orchestration, qa-engineer]
    - name: nixos-linux-specialist
      tags: [platform-engineer, nixos]
    - name: packer-imaging-expert
      tags: [platform-engineer, imaging]
    - name: spec-driven-initiation-engineer
      tags: [developer, spec]
    - name: terraform-platform-engineer
      tags: [platform-engineer, terraform]
    - name: git-worktree-management
      tags: [developer, qa-engineer]
    - name: github-ghec
      tags: [platform-engineer, security-engineer]

  agents:
    - name: gitlab-repo-management
      tags: [platform-engineer]

  commands:
    - name: do-release-gitlab
      tags: [platform-engineer]

  rules:
    - agents-md

  # Each resource can have:
  #   - skills: list of skill folders to symlink (from skills/ subfolder or root SKILL.md)
  #   - agents: list of agent files to symlink (from agents/ subfolder)
  #   - plugins: list of plugins to install via harness commands (from plugins/ subfolder)
  #   - npx-package: GitHub owner/repo shorthand. Produces "npx skills add <package> -y -g".
  #                   Always uses -y (non-interactive) and -g (global) flags.
  #                   When set, the resource is NOT cloned or symlinked.
  #   - command: full custom command string for non-standard installs (e.g. CLI tools).
  #               Takes priority over npx-package. Executed as-is.
  # If skills/agents/plugins is empty or missing:
  #   - For skills: link repo root if SKILL.md exists, or link all from skills/ subfolder
  #   - For agents: only link if explicitly listed
  #   - For plugins: report install commands (NOT symlinked)
resources:
  - name: anthropic-cybersecurity
    source: https://github.com/mukul975/Anthropic-Cybersecurity-Skills.git
    enabled: false
    tags: [security, security-engineer]
    npx-package: "mukul975/Anthropic-Cybersecurity-Skills"
  - name: drawio
    source: https://github.com/Agents365-ai/365-skills.git
    enabled: false
    tags: [developer]
    npx-package: "Agents365-ai/365-skills"
  - name: improve
    source: https://github.com/shadcn/improve.git
    enabled: true
    tags: [developer]
    npx-package: "shadcn/improve"
  - name: codeberg-skill
    source: https://codeberg.org/CypherpunkSamurai/codeberg-skill.git
    enabled: false
    tags: [developer]
    npx-package: "CypherpunkSamurai/codeberg-skill"
  - name: agent-skills
    source: https://codeberg.org/ky64/agent-skills.git
    enabled: false
    tags: [developer]
    npx-package: "ky64/agent-skills"
  - name: mattpocock-skills
    source: https://github.com/mattpocock/skills.git
    enabled: false
    tags: [developer]
    npx-package: "mattpocock/skills"
  - name: superpowers
    source: https://github.com/obra/superpowers.git
    enabled: false
    tags: [developer]
    npx-package: "obra/superpowers"
  - name: awesome-copilot
    source: https://codeberg.org/codebergmember123/awesome-copilot.git
    enabled: false
    tags: [developer]
    npx-package: "codebergmember123/awesome-copilot"
  - name: codegraph
    source: https://github.com/colbymchenry/codegraph.git
    enabled: true
    tags: [developer, qa-engineer]
    command: "npx @colbymchenry/codegraph install --yes --no-permissions"
    check: "codegraph --version"
    update: "npx @colbymchenry/codegraph install --yes --no-permissions"
  - name: agentic-awesome-skills
    source: https://github.com/sickn33/agentic-awesome-skills.git
    enabled: false
    tags: [developer]
    npx-package: "sickn33/agentic-awesome-skills"
    skills:
      - "007"
      - agents-md
      - google-calendar-automation
      - google-docs-automation
      - google-sheets-automation
      - google-slides-automation
      - grafana-dashboards
  - name: graphify
    source: https://github.com/Graphify-Labs/graphify.git
    enabled: false
    tags: [platform-engineer]
    command: "uv tool install graphifyy && graphify install --platform agents"
    check: "graphify --version"
    update: "uv tool install graphifyy && graphify install --platform agents"
  - name: spec-kit
    source: https://github.com/github/spec-kit.git
    enabled: true
    tags: [developer, platform-engineer, qa-engineer]
    command: "uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v0.16.4"
    check: "specify --version"
    update: "uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v0.16.4"
  - name: impeccable
    source: https://github.com/pbakaus/impeccable
    enabled: false
    tags: [developer]
    npx-package: "impeccable"
  - name: repomix
    source: https://github.com/yamadashy/repomix
    enabled: true
    tags: [developer, platform-engineer, qa-engineer, security-engineer]
    npx-package: repomix
  - name: open-code-review
    source: https://github.com/alibaba/open-code-review
    enabled: true
    tags: [developer, qa-engineer, security-engineer]
    npx-package: "alibaba/open-code-review"

# Standalone Plugins
# Plugins are installed via harness-specific commands (never downloaded locally)
# Each plugin source can be one of:
#   - Git repository URL: github:user/repo, https://github.com/user/repo.git
#   - Local path: ./path/to/plugin, /absolute/path/to/plugin
#   - NPM package: @scope/plugin-name, plugin-name (supports semver ranges like name@^1.2)
#   - Marketplace plugin: plugin-name@marketplace-name (after marketplace is added)
plugins:
  - name: ponytail
    source: https://github.com/DietrichGebert/ponytail
    enabled: false
    tags: [developer]
  # Install commands follow upstream: clone once outside the catalog clone, then
  # use each agent's own plugin manager.
  - name: tokeneconomizer
    source: https://github.com/microsoft/TokenEconomizer
    enabled: true
    tags: [developer]
    install:
      claude-code: 'P="$HOME/.local/share/acman/plugins/tokeneconomizer"; test -d "$P" || git clone --depth 1 https://github.com/microsoft/TokenEconomizer.git "$P"; claude plugin marketplace add "$P" && claude plugin install tokeneconomizer@tokeneconomizer'
      codex: 'P="$HOME/.local/share/acman/plugins/tokeneconomizer"; test -d "$P" || git clone --depth 1 https://github.com/microsoft/TokenEconomizer.git "$P"; codex plugin marketplace add "$P" && codex plugin add tokeneconomizer@tokeneconomizer'
      copilot: 'P="$HOME/.local/share/acman/plugins/tokeneconomizer"; test -d "$P" || git clone --depth 1 https://github.com/microsoft/TokenEconomizer.git "$P"; copilot plugin marketplace add "$P" && copilot plugin install tokeneconomizer@tokeneconomizer'
      opencode: 'P="$HOME/.local/share/acman/plugins/tokeneconomizer"; test -d "$P" || git clone --depth 1 https://github.com/microsoft/TokenEconomizer.git "$P"; mkdir -p "$HOME/.config/opencode/plugins" && ln -sf "$P/plugin/opencode/tokeneconomizer.ts" "$HOME/.config/opencode/plugins/tokeneconomizer.ts"'
      antigravity: 'P="$HOME/.local/share/acman/plugins/tokeneconomizer"; test -d "$P" || git clone --depth 1 https://github.com/microsoft/TokenEconomizer.git "$P"; cd "$P" && python scripts/build_plugin.py --out dist/marketplace && agy plugin install dist/marketplace/tokeneconomizer'
      cursor: 'P="$HOME/.local/share/acman/plugins/tokeneconomizer"; test -d "$P" || git clone --depth 1 https://github.com/microsoft/TokenEconomizer.git "$P"; cd "$P" && python scripts/build_plugin.py --out "$HOME/.cursor/plugins/local/"'
      pi: 'pi install git:github.com/microsoft/TokenEconomizer'

profiles:
  developer:
    description: Day-to-day development, review and external coding resources.
    tags: [developer]
  platform-engineer:
    description: Platform, infrastructure and enterprise repository administration.
    tags: [platform-engineer]
  qa-engineer:
    description: Quality engineering, test workflows and code analysis.
    tags: [qa-engineer]
  security-engineer:
    description: Security review, code analysis and enterprise administration.
    tags: [security-engineer]
