providers:
  webSearchOrder:
    - gemini
    - perplexity
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
  autoThinkingMaxEffort: medium
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 2
agent:
  reasoning_effort: auto
  interactive: true
  max_iterations: 12
code:
  style: functional
  include_comments: true
  framework_preferences:
    terraform: ">= 5.0"
    python: "3.11"
    go: "1.22"
    typescript: bun
personality: pragmatic
textVerbosity: low
rules:
  autoConnectLsp: true
  trackModelConsumption: true
statusLine:
  preset: full
  sessionAccent: true
tui:
  textSizing: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
startup:
  checkUpdate: false
memory:
  backend: local
renderMermaid:
  enabled: false
github:
  enabled: false
images:
  describeForTextModels: false
hideThinkingBlock: true
autolearn:
  enabled: true
task:
  isolation:
    mode: auto
  eager: preferred
  maxEffort: medium
  maxConcurrency: 1
autoResume: true
autocompleteMaxVisible: 10
dev:
  autoqa: false
defaultThinkingLevel: auto
proseOnlyThinking: true
omitThinking: true
checkpoint:
  enabled: true
compaction:
  handoffSaveToDisk: true
  keepRecentTokens: 8000
  supersedeReads: true
  dropUseless: true
  methodOrder:
    - snapcompact
    - remote
    - soft
  idleEnabled: true
  idleThresholdTokens: 100000
  idleTimeoutSeconds: 120
snapcompact:
  toolResults: true
  systemPrompt: agents-md
files:
  read:
    defaultLimit: 150
tools:
  artifactTailLines: 50
  outputMaxColumns: 256
  artifactTailBytes: 2.5
  artifactSpillThreshold: 20
grep:
  contextAfter: 1
modelRoles:
  default: nvidia/deepseek-ai/deepseek-v4-flash-0731
retry:
  maxDelayMs: 0